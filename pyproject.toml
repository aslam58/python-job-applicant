[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-job-applicant"
version = "0.2.0"
description = "Python job search, local resume matching, and assisted application filling without AI."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49,<2",
    "pypdf>=5,<8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[project.scripts]
job-applicant = "job_applicant:main"

[tool.setuptools]
packages = ["applicant"]
py-modules = ["job_applicant", "board_search", "india_sources", "resume_match"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
